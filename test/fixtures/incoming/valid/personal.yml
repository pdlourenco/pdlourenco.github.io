# FIXTURE — contract v1. Not real data.
#
# Covers what the plugin's own fixtures leave empty. Exercises: page-level link
# objects, the _root pseudo-section for blocks before the first "## Header",
# section slugging (& -> and), and embeds that must degrade to plain links (D19).
#
# Page keys are in alphabetical order because that is what the plugin emits: its
# `sortKeys(personalPages)` alphabetises the top level. Section order *inside* a page is
# authored order, which the plugin deliberately preserves — so `diy` keeps tools-before-
# projects. The two halves differ, and the fixture has to show both (D55).
cycling_and_hiking:
  title: Cycling & Hiking
  description: Trails and long rides.
  wikiloc:
    id: johndoe
    url: "https://www.wikiloc.com/wikiloc/user.do?id=000000"
  strava:
    id: "12345678"
    url: "https://www.strava.com/athletes/12345678"
  sections:
    featured_trips:
      - _name: A Long Ride
        distance_km: "120"
        trail:
          id: A Long Ride
          url: "https://www.wikiloc.com/trails/a-long-ride-00000000"
diy:
  title: DIY
  description: null
